<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>麻将研究 · 对战台</title><link rel="stylesheet" href="/assets/style.css"></head><body>
<header><div class="brand">雀研<span>本地策略研究</span></div><div id="connection">正在连接</div></header>
<main><section class="title"><div><p class="eyebrow">MAHJONG RESEARCH ARENA</p><h1>让策略上桌见分晓。</h1><p class="muted">独立研究，共同对战。每一期完成后，再决定下一步。</p></div><button id="new">新建研究</button></section>
<section class="control"><label>研究记录 <select id="runs" aria-label="研究记录"></select></label><span id="status" class="badge">未开始</span><span class="budget">剩余 <strong id="remaining">—</strong></span><button id="pause">暂停</button><button id="resume" class="primary">继续</button><button id="budget">增加 15 分钟</button></section>
<p id="error" role="alert"></p><section class="overview"><article><span>当前期数</span><strong id="period">—</strong></article><article><span>完整对局</span><strong id="matches">0 / 128</strong></article><article><span>在场选手</span><strong id="pool">4 / 16</strong></article><article><span>研究方向</span><strong id="direction-count">—</strong></article></section>
<div class="columns"><section><div class="section-head"><h2>正在对战</h2><span class="muted">每桌四人 · 一局八手</span></div><div id="tables" class="tables"></div><div class="section-head"><h2>本期积分</h2><span class="muted">名次效用 3 / 2 / 1 / 0</span></div><div class="table-wrap"><table><thead><tr><th>名次</th><th>候选 / 方向</th><th>平均效用</th><th>出场</th><th>对手数</th><th>超时</th></tr></thead><tbody id="ranking"></tbody></table></div><p class="muted small">只按本期完整对局排名。超时采用平台默认动作，对局照常结算。</p></section><aside><div class="section-head"><h2>研究中的方向</h2></div><div id="directions"></div><div class="section-head"><h2>任务队列</h2></div><div id="queue"></div></aside></div>
<section><div class="section-head"><h2>历史结果与事件</h2><span class="muted">跨方向共享比赛成绩</span></div><div id="history"></div><details><summary>全部候选与准备结果</summary><div id="candidates" class="table-wrap"></div></details><details><summary>研究会话日志</summary><div id="activity" class="activity"></div></details><div id="events" class="events"></div></section></main>
<dialog id="create"><form id="create-form"><h2>开始一次新的研究</h2><p class="muted">选择已配置的研究方向</p><div id="choices"></div><label>运行预算（分钟）<input name="minutes" type="number" min="1" max="1440" value="60" required></label><p id="create-error" role="alert"></p><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">创建并开始</button></div></form></dialog><script src="/assets/app.js"></script></body></html>
