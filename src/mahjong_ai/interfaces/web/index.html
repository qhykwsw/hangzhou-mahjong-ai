<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>杭州麻将 · 迭代线</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="tile" aria-hidden="true">發</span>
        <div>
          <h1>杭州麻将迭代线</h1>
          <p>规则线与 RL 线各自迭代，对固定对手池评测</p>
        </div>
      </div>
      <span class="readonly-note">只读 · 调整请通过对话</span>
    </header>
    <section id="linesView" class="lines-view">
      <div class="sectionhead">
        <h2>迭代线 <span id="linesPool" class="count"></span> <select id="linesPoolPick" class="lines-pool" aria-label="对手池" hidden></select></h2>
        <span class="muted">每个点是一次尝试；纵轴是对固定对手池的场均桌面分；远低于最好版本的尝试画在底边（▼），悬停看分数</span>
      </div>
      <div class="lines-toolbar">
        <div id="linesLegend" class="lines-legend"></div>
        <div id="linesRange" class="lines-range" role="group" aria-label="图的时间范围">
          <button type="button" data-days="1">最近 1 天</button>
          <button type="button" data-days="3">最近 3 天</button>
          <button type="button" data-days="0">全部</button>
        </div>
      </div>
      <div id="linesChart" class="lines-chart"></div>
      <div class="sectionhead proxyhead">
        <h2>代理桌（比赛人群）</h2>
        <span id="proxyNote" class="muted">各版本对 fp-rule-131 的整场配对差，横线为 95% 区间</span>
      </div>
      <div id="proxyChart" class="lines-chart"></div>
      <div class="sectionhead proxyhead">
        <h2>线上自由对战</h2>
        <span id="onlineNote" class="muted"></span>
      </div>
      <div id="onlineChart" class="lines-chart"></div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>尝试</th><th>结果</th><th>改动</th><th>得分</th><th>配对差</th><th>确认集 / 逐手对比</th><th>场数</th><th>完成时间</th></tr>
          </thead>
          <tbody id="linesTable"></tbody>
        </table>
      </div>
    </section>
    <script src="/assets/lines.js"></script>
  </body>
</html>
