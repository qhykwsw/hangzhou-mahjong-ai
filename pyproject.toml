[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mahjong-ai-iteration"
version = "0.1.0"
description = "Multi-policy self-iteration infrastructure for Hangzhou Mahjong AI"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "starlette>=0.40,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.5"]
# 模型座位的推理服务（Mac 用 MLX/MPS）；自我对弈项目 src/ 随发布包分发，仍不得依赖它。
model = ["torch>=2.5", "mlx>=0.32.2,<0.33; sys_platform == 'darwin' and platform_machine == 'arm64' and platform_release >= '25'"]

[project.scripts]
mahjong-ai = "mahjong_ai.interfaces.cli:main"
mahjong = "mahjong_ai.interfaces.app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Tests run in parallel, each on whichever worker is free (-n 0 runs them in one process).
addopts = "-n auto --dist worksteal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mahjong_ai = ["interfaces/web/*.html", "interfaces/web/*.css", "interfaces/web/*.js"]
