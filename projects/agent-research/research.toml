# 统一研究分支（ADR-0013、ADR-0014）。分支阵容、[modes]、研究模型、anchors/guests 与主机分工
# 改动后自动应用到运行中的实验；其余键是评估条件，随新实验冻结。
opponent_limit = 3  # 评估对手：最近一次共同大乱斗前三名（锚点除外）
iteration_seconds = 600  # 单次分支迭代的执行预算：Agent 必须在 10 分钟内提出并提交候选
agent_concurrency = 6
training_workers = 12
match_workers = 24  # 28 线程机器留 4 个给服务与 Agent；其他机器在 .local/machine.toml 覆盖并发
candidate_limit = 1
evaluation_games = 1024  # 分段配对评估首段每边场数：1024 → 2048 → 4096
evaluation_stages = 3
early_confidence = 0.99
final_confidence = 0.95
evaluation_shards = 4
brawl_appearances = 8192  # 大乱斗每个参赛者出场数
brawl_promotions = 4
brawl_fallback_seconds = 43200
brawl_host = "4090"
overflow_hosts = ["4090"]
anchors = ["imitation-start--20260923-large"]  # 参照锚点：RL 固定起点
guests = []  # 首次大乱斗的临时嘉宾 rl-2h-a2 已在开场大乱斗后撤下
training_games = 16
initialization_seconds = 3600

[hosts.4090]
ssh = "user@gpu-4090"
distro = "Ubuntu-20.04"
user = "user"
python = "/home/user/miniconda3/envs/py311_cu130/bin/python"
root = "/home/user/code/leihuo_majiang"
workers = 16  # 20 线程的 80%

[hosts.4070]
ssh = "user@gpu-4070"
distro = "Ubuntu-20.04"
user = "user"
python = "/home/user/miniconda3/envs/py311_cu130/bin/python"
root = "/home/user/code/leihuo_majiang"
workers = 14  # 28 线程的一半：这是用户的办公机，满载评估会让桌面卡顿

[training_caps]
heuristic = 0
search = 0
value = 256
ppo = 256

[[combinations]]
id = "heuristic-efficiency"
branches = 2
branch_ids = ["01", "02"]
models = ["deepseek", "astra-high"]
parameters = { style = "efficiency" }

[[combinations]]
id = "heuristic-fan"
branches = 2
branch_ids = ["01", "02"]
models = ["deepseek", "astra-high"]
parameters = { style = "fan" }

[[combinations]]
id = "heuristic-adaptive"
branches = 1
branch_ids = ["01"]
models = ["deepseek"]
parameters = { style = "adaptive" }

[[combinations]]
id = "heuristic-unrestricted"
branches = 1
branch_ids = ["01"]
models = ["deepseek"]
parameters = { style = "unrestricted" }

[[combinations]]
id = "rl-recipe"  # 方案分支：训练在 4070，评估改在 4090（4070 是办公机，满载会卡桌面），每段每边 4096 → 8192 → 16384 场
branches = 1
branch_ids = ["01"]
models = ["astra-high"]
parameters = { line = "rl" }
evaluation_games = 4096
evaluation_host = "4090"

[game]
rounds = 16  # 跟随锦标赛配置（二测四个阶段均为 Rounds=16）；自动匹配房的 8 局是自由对战默认，不是赛制
games_per_round = 1
stage = "qualifier"
base_score = 1

[timeouts]
discard = 3.0
response = 1.0

[resources]
memory_mb = 4096
threads = 1
device = "cpu"
